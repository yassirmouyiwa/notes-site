# =====================================================================
#  pg_hba_exemple.conf — Contrôle d'accès client (HBA = Host-Based Auth)
#  Formation DBA PostgreSQL 16
#
#  Fichier lu de HAUT en BAS : la PREMIÈRE ligne qui correspond
#  (type, base, utilisateur, adresse) décide. Aucune ligne suivante
#  n'est évaluée ensuite — l'ordre est donc critique.
#
#  Recharger après modification :  SELECT pg_reload_conf();
#  Vérifier les règles chargées :  TABLE pg_hba_file_rules;
#
#  Colonnes : TYPE  BASE  UTILISATEUR  ADRESSE  MÉTHODE  [options]
# =====================================================================

# --- TYPES ---
#   local     : socket Unix (pas de réseau)
#   host      : TCP/IP, chiffré ou non
#   hostssl   : TCP/IP, UNIQUEMENT si la connexion est chiffrée (TLS)
#   hostnossl : TCP/IP, UNIQUEMENT si NON chiffrée (à éviter)
#
# --- MÉTHODES (de la plus forte à proscrire) ---
#   cert            : certificat client X.509 (authentification forte, sans mot de passe)
#   scram-sha-256   : mot de passe haché SCRAM (minimum recommandé)
#   ldap / gss      : délégation à un annuaire d'entreprise / Kerberos
#   peer            : identité de l'utilisateur système (local uniquement)
#   md5             : FAIBLE — à migrer vers scram-sha-256
#   password        : mot de passe EN CLAIR — NE JAMAIS utiliser
#   trust           : AUCUNE authentification — NE JAMAIS utiliser hors socket local jetable
#   reject          : refuse explicitement

# =====================================================================
#  1. Accès local d'administration (socket, identité système)
# =====================================================================
# L'administrateur système 'postgres' s'authentifie par 'peer' (aucun mot de passe
# réseau) : il doit déjà être l'utilisateur Unix postgres.
local   all             postgres                                peer

# Autres accès locaux par socket : mot de passe SCRAM.
local   all             all                                     scram-sha-256

# =====================================================================
#  2. Supervision locale
# =====================================================================
# Compte de supervision (rôle pg_monitor) depuis la machine elle-même.
hostssl all             exporter        127.0.0.1/32            scram-sha-256

# =====================================================================
#  3. Application métier — TLS obligatoire, depuis le réseau applicatif
# =====================================================================
# Option A (recommandée) : authentification par CERTIFICAT client.
#   Le CN du certificat doit correspondre au rôle (ou via pg_ident.conf).
#   clientcert=verify-full impose un certificat client valide ET correspondant.
hostssl banque          app_banque      10.0.1.0/24            cert clientcert=verify-full

# Option B (alternative) : SCRAM sur TLS, en exigeant tout de même un certificat client.
# hostssl banque        app_banque      10.0.1.0/24            scram-sha-256 clientcert=verify-ca

# =====================================================================
#  4. Utilisateurs humains (DBA, analystes) — TLS obligatoire, réseau d'admin
# =====================================================================
hostssl all             +dba            10.0.9.0/24            scram-sha-256
hostssl banque          +analystes      10.0.9.0/24            scram-sha-256

# =====================================================================
#  5. Réplication — réplique physique, TLS + certificat
# =====================================================================
# Le mot-clé spécial 'replication' dans la colonne BASE cible les connexions
# de réplication en flux (streaming), pas une base nommée.
hostssl replication     replicator      10.0.2.11/32           cert clientcert=verify-full
hostssl replication     replicator      10.0.2.12/32           cert clientcert=verify-full

# =====================================================================
#  6. Filet de sécurité : tout refuser explicitement
# =====================================================================
# Barrière finale : toute connexion non couverte ci-dessus est rejetée.
# (Techniquement redondant — l'absence de correspondance rejette déjà —
#  mais explicite l'intention et évite qu'un ajout involontaire plus permissif
#  en fin de fichier ne laisse passer quelque chose.)
host    all             all             0.0.0.0/0              reject
host    all             all             ::/0                   reject

# =====================================================================
#  RÈGLES D'OR :
#   - Aucune ligne 'trust', 'password' ni 'md5' en production.
#   - 'hostssl' partout pour le réseau ; jamais 'host' simple à distance.
#   - Du plus spécifique au plus général (l'ordre décide).
#   - Restreindre les ADRESSES au plus juste (/32 quand c'est possible).
#   - Après mode : TABLE pg_hba_file_rules;  puis  SELECT pg_reload_conf();
# =====================================================================
