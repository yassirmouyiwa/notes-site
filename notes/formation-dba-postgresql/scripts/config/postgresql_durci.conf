# =====================================================================
#  postgresql_durci.conf — Extrait de configuration durcie (sécurité)
#  Formation DBA PostgreSQL 16
#
#  À placer dans /etc/postgresql/16/main/conf.d/50-durcissement.conf
#  (les valeurs de dimensionnement mémoire sont à ADAPTER au serveur).
#  Rappel : redémarrage requis pour shared_preload_libraries, ssl (à froid),
#  listen_addresses ; rechargement (SIGHUP) suffisant pour la plupart des autres.
# =====================================================================

# ------------------------- Réseau ------------------------------------
# N'écouter que sur les interfaces nécessaires. JAMAIS '*' sans pare-feu strict.
listen_addresses = 'localhost'          # ajouter l'IP privée si accès distant requis
port = 5432

# Nombre maximal de connexions ; réserver des connexions à l'administration.
max_connections = 100
superuser_reserved_connections = 3

# ------------------------- TLS / chiffrement en transit --------------
ssl = on
ssl_cert_file = '/etc/ssl/postgresql/server.crt'
ssl_key_file  = '/etc/ssl/postgresql/server.key'   # doit être 0600, propriété postgres
ssl_ca_file   = '/etc/ssl/postgresql/root.crt'     # pour l'authentification par certificat client
ssl_min_protocol_version = 'TLSv1.2'
ssl_ciphers = 'HIGH:!aNULL:!MD5:!3DES'
ssl_prefer_server_ciphers = on

# ------------------------- Authentification --------------------------
password_encryption = scram-sha-256     # jamais md5

# Ralentir les attaques par force brute (nécessite auth_delay en preload)
# shared_preload_libraries voir plus bas
auth_delay.milliseconds = 500

# ------------------------- Journalisation de sécurité ----------------
logging_collector = on
log_destination = 'stderr'
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_file_mode = 0600
log_rotation_age = 1d
log_rotation_size = 100MB

# Tracer connexions, déconnexions et DDL ; préfixe complet pour l'analyse et le SIEM.
log_connections = on
log_disconnections = on
log_statement = 'ddl'                   # 'mod' pour tracer aussi les écritures
log_line_prefix = '%m [%p] %q%u@%d %h app=%a '   # horodatage, pid, user, base, IP client, application
log_min_duration_statement = 1000       # journaliser les requêtes > 1 s
log_lock_waits = on
log_temp_files = 0                       # journaliser tous les fichiers temporaires
log_checkpoints = on
log_autovacuum_min_duration = 0

# ------------------------- Extensions de sécurité / observabilité ----
# pgaudit : audit structuré ; pg_stat_statements : détection d'anomalies ; auth_delay : anti-force brute
shared_preload_libraries = 'pg_stat_statements,pgaudit,auth_delay'
pg_stat_statements.track = all
pgaudit.log = 'ddl, role, write'         # ajouter 'read' sur les bases très sensibles
pgaudit.log_catalog = off
pgaudit.log_parameter = on
pgaudit.log_relation = on

# ------------------------- Limitation des dégâts ---------------------
# Un délai maximal d'exécution coupe les requêtes anormalement longues
# (protège des injections temporelles et des requêtes emballées).
# À définir plutôt par rôle applicatif via ALTER ROLE ... SET statement_timeout.
statement_timeout = 0                    # 0 = illimité au niveau global ; régler par rôle
idle_in_transaction_session_timeout = '10min'
lock_timeout = '30s'

# ------------------------- Sauvegarde / WAL --------------------------
wal_level = replica                      # 'logical' si réplication logique
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/archives/%f && cp %p /var/lib/postgresql/archives/%f'
wal_log_hints = on                       # nécessaire à pg_rewind
max_slot_wal_keep_size = '10GB'          # évite qu'un slot abandonné sature le disque

# ------------------------- Divers ------------------------------------
# Empêcher qu'un ALTER SYSTEM ne contourne la configuration gérée (PG 17+)
# allow_alter_system = off

# =====================================================================
#  Après application :
#   - vérifier :  SELECT name, setting, source FROM pg_settings WHERE ...
#   - contrôler la syntaxe :  SELECT * FROM pg_file_settings WHERE error IS NOT NULL;
#   - passer l'audit :  psql -f scripts/sql/audit_securite.sql
# =====================================================================
